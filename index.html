<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>用戶信息調查</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100vh}
  body{background:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1d1d1f;overflow-x:hidden;transition:background .6s,color .6s}
  body.dark-mode{background:#0a0a0a;color:#e8e8e8}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px}
  .top-time{position:fixed;top:22px;right:28px;z-index:50;text-align:right;font-size:13px;color:#8a8a8a;font-variant-numeric:tabular-nums;pointer-events:none}
  .top-time .small{font-size:10px;color:#555;letter-spacing:.15em;text-transform:uppercase;display:block;margin-top:2px}
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 12px;font-size:12px;color:#6a6a6a}
  .top-bar .close-btn{font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .top-bar .title{font-size:15px;font-weight:500;color:#1d1d1f;letter-spacing:1px}
  body.dark-mode .top-bar .title{color:#c8c8c8}
  .top-bar .more-btn{font-size:18px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .progress-wrap{display:flex;align-items:center;gap:12px;padding:8px 0 16px;font-size:12px;color:#8a8a8a}
  .progress-bar-bg{flex:1;height:2px;background:#e5e5ea;border-radius:2px;overflow:hidden}
  body.dark-mode .progress-bar-bg{background:#2a2a2a}
  .progress-bar-fill{height:100%;background:#aeaeb2;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1),background .6s;width:0}
  .progress-bar-fill.danger{background:#8B0000}
  .call-timer{text-align:right;font-size:13px;color:#c0392b;font-family:'Courier New',monospace;letter-spacing:1px;line-height:1.6;padding:4px 0 12px;min-height:24px}
  .call-timer .small{font-size:10px;color:#6a6a6a;display:block}
  .question-area{flex:1;display:flex;flex-direction:column;padding-bottom:40px}
  .question-card{background:#fff;border-radius:20px;padding:28px 22px;border:1px solid #e5e5ea;margin-bottom:20px;transition:border .4s,box-shadow .4s,background .5s}
  body.dark-mode .question-card{background:rgba(18,18,18,.85);border-color:rgba(255,255,255,.06)}
  .question-card.glitch-border{animation:borderGlitch .35s ease-in-out 4}
  @keyframes borderGlitch{0%,100%{border-color:#e5e5ea;box-shadow:none}20%{border-color:rgba(139,0,0,.9);box-shadow:0 0 28px rgba(139,0,0,.6)}40%{border-color:rgba(139,0,0,.2);box-shadow:0 0 6px rgba(139,0,0,.15)}60%{border-color:rgba(139,0,0,.8);box-shadow:0 0 24px rgba(139,0,0,.5)}80%{border-color:rgba(139,0,0,.4);box-shadow:0 0 10px rgba(139,0,0,.2)}}
  .q-number{font-size:11px;color:#aeaeb2;letter-spacing:.15em;margin-bottom:14px;text-transform:uppercase}
  body.dark-mode .q-number{color:#6a6a6a}
  .q-hint{font-size:12px;color:#8B0000;letter-spacing:.15em;margin-top:-8px;margin-bottom:14px;opacity:0;transition:opacity .6s}
  .q-hint.show{opacity:1}
  .q-text{font-size:18px;line-height:1.6;color:#1d1d1f;margin-bottom:24px;font-weight:500}
  body.dark-mode .q-text{color:#e0e0e0;font-weight:400}
  .options-list{display:flex;flex-direction:column;gap:10px}
  .opt-item{display:flex;align-items:center;padding:16px 18px;background:#fff;border:1px solid #e5e5ea;border-radius:14px;cursor:pointer;transition:all .35s;user-select:none}
  body.dark-mode .opt-item{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06)}
  .opt-item:active{transform:scale(.98);background:rgba(139,0,0,.06);border-color:rgba(139,0,0,.3)}
  .opt-item.blurred{filter:blur(4px);opacity:.3;pointer-events:none}
  .opt-item.selected{border-color:#8B0000;background:rgba(139,0,0,.08)}
  .opt-item.auto-highlight{border-color:#8B0000;background:rgba(139,0,0,.08);animation:autoPulse 1s ease-in-out infinite}
  @keyframes autoPulse{0%,100%{box-shadow:0 0 0 rgba(139,0,0,0)}50%{box-shadow:0 0 20px rgba(139,0,0,.4)}}
  .q10-hint{font-size:12px;color:#8B0000;letter-spacing:.15em;margin-bottom:8px;padding-left:18px;min-height:18px}
  .opt-label{font-size:13px;font-weight:600;color:#8B0000;width:26px;flex-shrink:0}
  .opt-text{font-size:15px;color:#8E8E93;line-height:1.4}
  body.dark-mode .opt-text{color:#c8c8c8}
  .replaced-content{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;padding:20px 4px;text-align:center;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .replaced-content.show{opacity:1;transform:translateY(0)}
  .monitor-text{font-size:15px;line-height:1.9;color:#c0392b;letter-spacing:.3px;margin:0}
  .bottom-subtitle{text-align:center;font-size:15px;color:#8E8E93;line-height:1.8;padding:20px 0 10px;min-height:60px;transition:opacity .6s;opacity:0}
  body.dark-mode .bottom-subtitle{color:#a0a0a0}
  .bottom-subtitle.show{opacity:1}
  .inline-reply{margin-top:-4px;margin-bottom:8px;padding:14px 0 14px 16px;border-left:3px solid #8B0000;text-align:left;opacity:0;transform:translateY(-4px);transition:opacity .7s ease,transform .7s ease}
  .inline-reply.show{opacity:1;transform:translateY(0)}
  .idle-hint{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:100;font-size:13px;color:#8a8a8a;letter-spacing:.15em;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;text-align:center;white-space:nowrap}
  .idle-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .opt-text.glitch-mode{color:#8B0000;font-family:'Courier New',monospace;letter-spacing:1px;animation:glitchFlicker .1s steps(1,end) infinite}
  @keyframes glitchFlicker{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
  body.shake-mode .app{animation:softShake .08s steps(2,end) 10}
  @keyframes softShake{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0,0)}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:360px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-radius:22px;border:1px solid rgba(139,0,0,.35);box-shadow:0 24px 60px rgba(0,0,0,.3);padding:32px 26px;text-align:center;transform:scale(.92);transition:transform .35s cubic-bezier(.4,0,.2,1)}
  body.dark-mode .modal{background:rgba(14,14,18,.95)}
  .overlay.show .modal{transform:scale(1)}
  .modal h3{font-size:22px;font-weight:600;color:#1d1d1f;margin-bottom:8px;letter-spacing:1px}
  body.dark-mode .modal h3{color:#e8e8e8}
  .modal p{font-size:14px;color:#6a6a6a;line-height:1.7;margin-bottom:24px}
  body.dark-mode .modal p{color:#a0a0a0}
  .modal-btns{display:flex;gap:12px;justify-content:center}
  .btn{padding:12px 28px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:1px;cursor:pointer;border:1px solid rgba(0,0,0,.1);background:rgba(0,0,0,.03);color:#1d1d1f;transition:all .2s;font-family:inherit;flex:1;max-width:140px}
  body.dark-mode .btn{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#d0d0d0}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:rgba(139,0,0,.15);border-color:rgba(139,0,0,.4);color:#8B0000}
  body.dark-mode .btn.primary{background:rgba(139,0,0,.35);border-color:rgba(139,0,0,.6);color:#f0c0c0}
  .home-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
  .home-screen .logo{font-family:'Times New Roman','Songti SC',serif;font-size:26px;letter-spacing:.18em;color:#1d1d1f;margin-bottom:12px}
  .home-screen .sub{font-size:12px;color:#8E8E93;letter-spacing:.3em;margin-bottom:48px;text-transform:uppercase}
  .home-screen .desc{font-size:14px;color:#6a6a6a;line-height:1.9;margin-bottom:48px;max-width:300px}
  .home-screen .start-btn{padding:16px 56px;border-radius:999px;font-size:15px;letter-spacing:2px;background:#1d1d1f;border:none;color:#fff;cursor:pointer;transition:all .3s;font-family:inherit;font-weight:500}
  .home-screen .start-btn:active{background:#000;transform:scale(.97)}
  .rebirth{position:fixed;inset:0;background:#0a0a0a;z-index:1500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;opacity:0;transition:opacity 1s;overflow-y:auto;pointer-events:none}
  .rebirth.show{opacity:1;pointer-events:auto}
  .rebirth .inner{max-width:440px;width:100%;text-align:center}
  .rebirth h1{font-family:'Times New Roman',serif;font-size:26px;letter-spacing:.12em;color:#e8e8e8;margin-bottom:24px;font-weight:600}
  .rebirth .desc{font-size:14px;color:#a0a0a0;line-height:1.9;margin-bottom:12px}
  .rebirth .lines{margin:44px 0 36px;text-align:left;padding:0 8px}
  .rebirth .lines p{font-size:15px;color:#b0b0b0;line-height:2;margin-bottom:10px;opacity:0;transform:translateY(10px);animation:fadeUp 1.4s ease forwards}
  .rebirth .lines p:nth-child(1){animation-delay:.8s}.rebirth .lines p:nth-child(2){animation-delay:2.4s}.rebirth .lines p:nth-child(3){animation-delay:4s}
  .rebirth .lines .soft{font-size:12px;color:#6a6a6a;animation:softGlow 3s infinite}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  @keyframes softGlow{0%,100%{opacity:.3}50%{opacity:.9}}
  .rebirth .actions{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .rebirth .actions .btn{max-width:100%;padding:15px 28px;font-size:15px}
  .rebirth .final-progress{margin-top:28px;padding:0 8px}
  .rebirth .final-progress .bar-wrap{display:flex;align-items:center;gap:10px;font-size:11px;color:#6a6a6a;letter-spacing:.1em}
  .rebirth .final-progress .bar-bg{flex:1;height:2px;background:#2a2a2a;border-radius:2px;overflow:hidden}
  .rebirth .final-progress .bar-fill{height:100%;width:90%;background:#8B0000;border-radius:2px}
  .rebirth .final-progress .err-code{margin-top:10px;font-family:'Courier New',monospace;font-size:11px;color:#8B0000;letter-spacing:1px;opacity:.75;text-align:left;line-height:1.8}
  .rebirth .footer-note{font-size:10px;color:#8a8a8a;letter-spacing:.05em;text-align:center;opacity:.6;padding:30px 0 10px;line-height:1.8}
  .leave-screen{position:fixed;inset:0;background:#0a0a0a;z-index:2500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center}
  .leave-screen.show{opacity:1;pointer-events:auto}
  .leave-screen .leave-title{font-family:'Times New Roman',serif;font-size:26px;letter-spacing:.12em;color:#8B0000;margin-bottom:60px;font-weight:600}
  .leave-screen .leave-hint{font-size:13px;color:#8B0000;letter-spacing:.15em;line-height:1.8;margin-bottom:12px;opacity:0;transition:opacity .6s;text-align:center;min-height:20px}
  .leave-screen .leave-hint.show{opacity:1}
  .leave-screen .input-row{display:flex;gap:10px;width:100%;max-width:380px}
  .leave-screen .input-row input{flex:1;padding:14px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#e8e8e8;font-size:15px;font-family:inherit;outline:none}
  .leave-screen .input-row input:focus{border-color:rgba(139,0,0,.5)}
  .leave-screen .send-btn{padding:14px 22px;border-radius:10px;border:1px solid rgba(139,0,0,.5);background:rgba(139,0,0,.2);color:#f0c0c0;font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit}
  .leave-screen .send-btn:active{transform:scale(.96)}
  .leave-screen .input-row.shake{animation:inputShake .35s ease-in-out}
  @keyframes inputShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .leave-screen .final-reply{opacity:0;transition:opacity .8s}
  .leave-screen .final-reply.show{opacity:1}
  .leave-screen .final-reply .line1{font-family:'Times New Roman',serif;font-size:24px;letter-spacing:.12em;color:#e8e8e8;margin-bottom:32px;font-weight:600;min-height:1.2em}
  .leave-screen .final-reply .line2{font-size:15px;color:#a0a0a0;line-height:2;margin-bottom:48px}
  .leave-screen .close-btn{padding:12px 40px;border-radius:999px;font-size:14px;letter-spacing:2px;border:1px solid rgba(139,0,0,.5);background:rgba(139,0,0,.15);color:#f0c0c0;cursor:pointer;font-family:inherit}
  .leave-screen .final-words{font-family:'Times New Roman',serif;font-size:22px;letter-spacing:.18em;color:#8B0000;line-height:2;opacity:0;transition:opacity 1s;text-align:center}
  .leave-screen .final-words.show{opacity:1}
  .type-cursor{display:inline-block;width:1px;height:0.9em;background:#e8e8e8;margin-left:3px;vertical-align:middle;animation:cursorBlink .7s steps(1,end) infinite}
  @keyframes cursorBlink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .type-cursor.hide{animation:none;opacity:0;transition:opacity .4s}
  .reentry-screen{position:fixed;inset:0;background:#0a0a0a;z-index:2200;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center}
  .reentry-screen.show{opacity:1;pointer-events:auto}
  .reentry-screen .reentry-text{font-family:'Times New Roman',serif;font-size:22px;letter-spacing:.15em;color:#e8e8e8;line-height:2}
  .block-screen{position:fixed;inset:0;background:#0a0a0a;z-index:2600;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center}
  .block-screen.show{opacity:1;pointer-events:auto}
  .block-screen .block-text{font-family:'Times New Roman',serif;font-size:22px;letter-spacing:.18em;color:#8B0000;line-height:2;min-height:60px}
  .block-screen .block-arrow{position:absolute;bottom:40px;right:32px;font-size:20px;color:#e8e8e8;opacity:0;transition:opacity .5s;cursor:pointer;user-select:none;padding:12px}
  .block-screen .block-arrow.show{opacity:.5}
  .block-screen .block-arrow:active{opacity:1}
  .packet-modal{width:100%;max-width:380px;background:rgba(14,14,18,.95);backdrop-filter:blur(18px);border-radius:22px;border:1px solid #8B0000;box-shadow:0 0 40px rgba(139,0,0,.4),0 24px 60px rgba(0,0,0,.7);padding:28px 24px;text-align:left;transform:scale(.92);transition:transform .35s;position:relative;overflow:hidden}
  .overlay.show .packet-modal{transform:scale(1)}
  .packet-wave{display:flex;align-items:center;gap:3px;height:28px;margin-bottom:16px}
  .packet-wave span{display:block;width:3px;background:#8B0000;border-radius:2px;animation:packetWave .8s infinite ease-in-out}
  .packet-wave span:nth-child(1){animation-delay:0s}.packet-wave span:nth-child(2){animation-delay:.1s}.packet-wave span:nth-child(3){animation-delay:.2s}.packet-wave span:nth-child(4){animation-delay:.3s}.packet-wave span:nth-child(5){animation-delay:.4s}.packet-wave span:nth-child(6){animation-delay:.5s}.packet-wave span:nth-child(7){animation-delay:.6s}
  @keyframes packetWave{0%,100%{height:6px;opacity:.4}50%{height:24px;opacity:1}}
  .packet-title{font-size:20px;font-weight:700;color:#e8e8e8;margin-bottom:6px;letter-spacing:1px}
  .packet-sub{font-size:12px;color:#6a6a6a;margin-bottom:22px;letter-spacing:.5px}
  .packet-body{margin-bottom:24px;padding:14px 16px;background:rgba(139,0,0,.08);border-left:2px solid #8B0000;border-radius:0 8px 8px 0;font-size:13px;color:#b0b0b0;line-height:1.7}
  .packet-body .highlight{color:#c0392b}
  .packet-footer{display:flex;gap:10px}
  .packet-footer .btn{flex:1;max-width:none;padding:12px 0;font-size:13px}
  .force-call-modal{width:100%;max-width:340px;background:rgba(14,14,18,.95);backdrop-filter:blur(20px);border-radius:22px;border:1px solid #8B0000;box-shadow:0 0 50px rgba(139,0,0,.5);padding:36px 28px;text-align:center;transform:scale(.92);transition:transform .35s}
  .overlay.show .force-call-modal{transform:scale(1)}
  .force-call-modal .wave-wrap{display:flex;align-items:center;justify-content:center;gap:4px;height:36px;margin-bottom:20px}
  .force-call-modal .wave-wrap span{display:block;width:3px;background:#8B0000;border-radius:2px;animation:forceWave .8s infinite ease-in-out}
  .force-call-modal .wave-wrap span:nth-child(1){animation-delay:0s}.force-call-modal .wave-wrap span:nth-child(2){animation-delay:.1s}.force-call-modal .wave-wrap span:nth-child(3){animation-delay:.2s}.force-call-modal .wave-wrap span:nth-child(4){animation-delay:.3s}.force-call-modal .wave-wrap span:nth-child(5){animation-delay:.4s}.force-call-modal .wave-wrap span:nth-child(6){animation-delay:.5s}.force-call-modal .wave-wrap span:nth-child(7){animation-delay:.6s}.force-call-modal .wave-wrap span:nth-child(8){animation-delay:.7s}.force-call-modal .wave-wrap span:nth-child(9){animation-delay:.8s}
  @keyframes forceWave{0%,100%{height:8px;opacity:.4}50%{height:32px;opacity:1}}
  .force-call-modal h3{font-size:20px;color:#e8e8e8;margin-bottom:8px;letter-spacing:3px}
  .force-call-modal p{font-size:14px;color:#8B0000;letter-spacing:4px;font-weight:600}
  .toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);z-index:3000;padding:14px 28px;border-radius:999px;font-size:14px;color:#f0c0c0;background:rgba(14,14,18,.9);backdrop-filter:blur(12px);border:1px solid rgba(139,0,0,.4);box-shadow:0 0 24px rgba(139,0,0,.25);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  body.collapse-mode .app{animation:signalShake .18s steps(2,end) 6}
  @keyframes signalShake{0%{transform:translate(0,0);filter:none}25%{transform:translate(-1px,1px);filter:brightness(1.1) contrast(1.1)}50%{transform:translate(1px,-1px);filter:brightness(.9)}75%{transform:translate(-1px,0);filter:brightness(1.05)}100%{transform:translate(0,0);filter:none}}
  body.collapse-mode .question-card{animation:cardFlicker .12s steps(2,end) 10}
  @keyframes cardFlicker{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>

<div class="top-time">
  <span id="beijingTime">--:--:--</span>
  <span class="small">北京时间</span>
</div>

<div class="idle-hint" id="idleHint"></div>

<div class="app" id="app">
  <div class="home-screen" id="homeScreen">
    <div class="logo">用戶信息調查</div>
    <div class="sub">User Information Survey</div>
    <div class="desc">本調查將用於心理偏好研究<br>所有資料將會匿名處理<br>請如實作答，無需思考太久</div>
    <button class="start-btn" id="startBtn">開始填寫</button>
  </div>

  <div id="surveyScreen" class="hidden" style="display:flex;flex-direction:column;min-height:100vh;">
    <div class="top-bar">
      <div class="close-btn" id="closeSurvey">✕</div>
      <div class="title">用戶信息調查</div>
      <div class="more-btn">···</div>
    </div>
    <div class="progress-wrap">
      <span id="progressText">第 1 題 / 共 20 題</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <div id="callTimerContainer"></div>
    <div class="question-area">
      <div class="question-card" id="questionCard">
        <div class="q-number" id="qNumber">第 1 題 / 共 20 題</div>
        <div class="q-hint" id="qHint"></div>
        <div class="q-text" id="qText">加载中...</div>
        <div class="options-list" id="optionsList"></div>
      </div>
      <div class="bottom-subtitle" id="bottomSubtitle"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="rebirth" id="rebirthScreen"></div>
<div class="leave-screen" id="leaveScreen"></div>
<div class="reentry-screen" id="reentryScreen"></div>
<div class="block-screen" id="blockScreen">
  <div class="block-text" id="blockText"></div>
  <div class="block-arrow" id="blockArrow">▷</div>
</div>

<script>
(function () {
  'use strict';

      var line16 = (q.hiddenReplies && q.hiddenReplies[label]) || '';
      initAudio(); startTinnitus(1200, 0.07);
      setTimeout(function () {
        var old = $('optionsList').querySelector('.inline-reply'); if (old) old.remove();
        var box = document.createElement('div');
        box.className = 'inline-reply'; box.id = 'inlineReply';
        box.innerHTML = '<div class="monitor-text">' + line16 + '</div>';
        if (el && el.nextSibling) el.parentNode.insertBefore(box, el.nextSibling);
        else if (el) el.parentNode.appendChild(box);
        setTimeout(function () { var b = $('inlineReply'); if (b) b.classList.add('show'); }, 60);
        setTimeout(function () { hideBottom(); rampTinnitus(0.06, 800); advance(); }, 2600);
      }, 400);
      return;
    }

    if (currentQ === 17 && !rewardEndShown) { rewardEndShown = true; stopTinnitus(1500); setTimeout(function () { advance(); }, 400); return; }

    if (currentQ === 18) {
      var reply = q.hiddenReplies && q.hiddenReplies[label];
      setTimeout(function () {
        if (reply) $('optionsList').innerHTML = '<div class="replaced-content show" id="replacedContent"><div class="monitor-text">' + reply + '</div></div>';
        var sub18 = document.createElement('div');
        sub18.className = 'inline-sub'; sub18.id = 'inlineSub18'; sub18.textContent = '你已經沒有退路了。';
        var rc = $('replacedContent');
        if (rc && rc.parentNode) rc.parentNode.insertBefore(sub18, rc.nextSibling);
        setTimeout(function () { var s = $('inlineSub18'); if (s) s.classList.add('show'); }, 400);
        setTimeout(function () { triggerCollapse(); }, 1800);
      }, 500);
      return;
    }

    setTimer(function () { advance(); }, 400);
  }

  function advance() {
    if (pageCollapsed) return;
    clearTimer(); transitioning = false;
    if (currentQ === 10 && !q10Glitch) { q10Glitch = true; document.body.classList.add('dark-mode'); renderQuestion(); return; }
    if (currentQ === 10 && q10Glitch) { currentQ = 11; renderQuestion(); return; }
    if (currentQ === 14 && !q14Replaced) { q14Replaced = true; renderQuestion(); return; }
    if (currentQ === 14 && q14Replaced) { currentQ = 15; renderQuestion(); return; }
    if (currentQ === 18) { triggerCollapse(); return; }
    currentQ++;
    if (currentQ > 18) { triggerCollapse(); return; }
    renderQuestion();
  }

  function setModal(cls, html) {
    var m = $('modal'); if (!m) return;
    m.className = cls; m.innerHTML = html; $('overlay').classList.add('show');
  }
  function hideOverlay() { $('overlay').classList.remove('show'); }
  function showOverlay(html) { setModal('modal', html); }

  function showPacketModal(callback) {
    setModal('packet-modal',
      '<div class="packet-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>' +
      '<div class="packet-title">⚠ 連線異常 · 已攔截</div>' +
      '<div class="packet-sub">PACKET INTERCEPTED · REC · 0x8B0000</div>' +
      '<div class="packet-body">偵測到來自 <span class="highlight">未知節點</span> 的深度意識訪問請求。<br>您並非唯一在填寫這份問卷的人。<br>本次調查已進入 <span class="highlight">觀察名單</span>。</div>' +
      '<div class="packet-footer"><button class="btn primary" id="packetBtn">继续</button></div>'
    );
    setTimeout(function () { var b = $('packetBtn'); if (b) b.onclick = function () { hideOverlay(); if (callback) callback(); }; }, 50);
  }

  function showVoiceRequest(onDecide) {
    showOverlay(
      '<div style="font-size:36px;color:#8B0000;margin-bottom:12px;">?</div>' +
      '<h3>未知用户</h3><p>语音通话请求</p>' +
      '<div class="modal-btns"><button class="btn" id="rejectCall">拒绝</button><button class="btn primary" id="acceptCall">同意</button></div>'
    );
    setTimeout(function () {
      var r = $('rejectCall'), a = $('acceptCall');
      if (r) r.onclick = function () { hideOverlay(); onDecide(false); };
      if (a) a.onclick = function () { hideOverlay(); onDecide(true); };
    }, 50);
  }

  function showForceCallModal() {
    setModal('force-call-modal',
      '<div class="wave-wrap"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>' +
      '<h3>通话中</h3><p>由不得你</p>'
    );
  }

  function startForcedCall() {
    if (callActive) return;
    callActive = true; callStartTime = Date.now();
    var c = $('callTimerContainer');
    c.innerHTML = '<div class="call-timer" id="callDuration">通话中 00:00 <span class="small">由不得你</span></div>';
    callDurationEl = $('callDuration');
    callTimer = setInterval(function () {
      if (!callActive) return;
      var e = Math.floor((Date.now() - callStartTime) / 1000);
      var m = String(Math.floor(e / 60)).padStart(2, '0'), s = String(e % 60).padStart(2, '0');
      if (callDurationEl) callDurationEl.innerHTML = '通话中 ' + m + ':' + s + ' <span class="small">由不得你</span>';
    }, 500);
  }

  function stopForcedCall() {
    callActive = false;
    if (callTimer) { clearInterval(callTimer); callTimer = null; }
    if (callDurationEl) {
      callDurationEl.innerHTML = '通话结束 <span class="small">由不得你</span>';
      var el = callDurationEl;
      setTimeout(function () { if (el && el.parentNode) el.parentNode.innerHTML = ''; }, 3000);
      callDurationEl = null;
    }
  }

  function triggerCollapse() {
    if (pageCollapsed) return;
    pageCollapsed = true; clearIdleTimer(); stopForcedCall(); stopTinnitus(1100);
    document.body.classList.add('collapse-mode');
    setTimeout(function () {
      $('surveyScreen').classList.add('hidden');
      document.body.classList.remove('collapse-mode');
      showRebirth();
    }, 1100);
  }

  function showRebirth() {
    var wrap = $('rebirthScreen');
    wrap.classList.add('show');
    wrap.innerHTML =
      '<div class="inner">' +
        '<h1>問卷填寫完畢</h1>' +
        '<p class="desc">感謝您完成本次《身份採集》調查。<br>您的作答記錄已提交。本次調查僅用於心理偏好研究，所有資料將會匿名處理。</p>' +
        '<div class="lines"><p>我讀完了你所有的答案。</p><p>你願意向我袒露這麼多心底的想法，真乖。</p><p class="soft">你的答案，只有我能看見。</p></div>' +
        '<div class="final-progress"><div class="bar-wrap"><span>18 / 20</span><div class="bar-bg"><div class="bar-fill"></div></div></div><div class="err-code">&gt; Q19_ERR :: NOT_FOUND<br>&gt; Q20_ERR :: NOT_FOUND</div></div>' +
        '<div class="actions"><button class="btn" id="continueChat">▷ 繼續與他對話</button><button class="btn" id="leaveBtn">▷ 離開</button></div>' +
        '<div class="footer-note">-由惡毒食人魚編譯-<br>內容存在ai生成 僅供娛樂</div>' +
      '</div>';
    setTimeout(function () {
      var c = $('continueChat'), l = $('leaveBtn');
      if (c) c.onclick = function () { showLeaveScreen(); };
      if (l) l.onclick = function () {
        leaveAttempts++;
        if (leaveAttempts <= 2) {
          var blockTexts = ['你要去哪裡。', '外面沒有我。'];
          showBlockScreen(blockTexts[leaveAttempts - 1]);
        } else {
          showFinalWordsAndReturn();
        }
      };
    }, 50);
  }

  function showBlockScreen(text) {
    var bs = $('blockScreen');
    var bt = $('blockText');
    var ba = $('blockArrow');
    bt.textContent = '';
    ba.classList.remove('show');
    bs.classList.add('show');

    var idx = 0;
    var typeInterval = 1000 / text.length;
    setTimeout(function () {
      var typer = setInterval(function () {
        if (idx >= text.length) {
          clearInterval(typer);
          setTimeout(function () { ba.classList.add('show'); }, 200);
          return;
        }
        bt.textContent += text[idx];
        idx++;
      }, typeInterval);
    }, 100);

    ba.onclick = function () {
      bs.classList.remove('show');
    };
  }

  function showFinalWordsAndReturn() {
    var s = $('leaveScreen');
    s.innerHTML = '<div class="final-words" id="finalWords">不要忘記我 我會繼續等你</div>';
    s.classList.add('show');
    setTimeout(function () {
      var fw = $('finalWords');
      if (fw) fw.classList.add('show');
    }, 50);
    setTimeout(function () {
      s.classList.remove('show');
      setTimeout(function () {
        returnToHome();
      }, 600);
    }, 2000);
  }

  function returnToHome() {
    $('rebirthScreen').classList.remove('show');
    $('leaveScreen').classList.remove('show');
    $('blockScreen').classList.remove('show');
    $('surveyScreen').classList.add('hidden');
    $('homeScreen').classList.remove('hidden');
    document.body.classList.remove('dark-mode');
    hasCompletedOnce = true;
    leaveAttempts = 0;
    currentQ = 1; q10Glitch = false; q14Replaced = false;
    reward2Shown = false; rewardEndShown = false;
    pageCollapsed = false; transitioning = false;
    $('callTimerContainer').innerHTML = '';
    hideBottom(); hideOverlay();
    $('modal').className = 'modal'; $('modal').innerHTML = '';
    $('qHint').textContent = ''; $('qHint').classList.remove('show');
  }

  function showLeaveScreen() {
    var s = $('leaveScreen'); if (!s) return;
    s.innerHTML =
      '<div class="leave-title">說吧。我在聽。</div>' +
      '<div class="leave-hint" id="leaveHint"></div>' +
      '<div class="input-row" id="leaveInputRow">' +
        '<input type="text" id="leaveInput" autocomplete="off">' +
        '<button class="send-btn" id="leaveSend">送出</button>' +
      '</div>';
    s.classList.add('show');

    var failCount = 0;
    var hintPool = ['說點我想聽的。', '你知道該說什麼。', '換一句。'];
    var hintUsed = [];

    setTimeout(function () {
      var input = $('leaveInput');
      var sendBtn = $('leaveSend');
      var row = $('leaveInputRow');
      var hintEl = $('leaveHint');

      function trySubmit() {
        var val = (input.value || '').trim();
        if (!val) return;

        var loveKeys = ['喜欢你', '喜歡你', '爱你', '愛你', '我爱你', '我愛你'];
        var stayKeys = ['留', '陪', '離開', '离开', '走', '跑', '在'];

        var loveIdx = -1, stayIdx = -1;

        for (var i = 0; i < loveKeys.length; i++) {
          var idx = val.indexOf(loveKeys[i]);
          if (idx !== -1 && (loveIdx === -1 || idx < loveIdx)) loveIdx = idx;
        }
        if (val.indexOf('心') !== -1 && val.indexOf('你') !== -1) {
          var xIdx = val.indexOf('心');
          if (loveIdx === -1 || xIdx < loveIdx) loveIdx = xIdx;
        }
        for (var j = 0; j < stayKeys.length; j++) {
          var sIdx = val.indexOf(stayKeys[j]);
          if (sIdx !== -1 && (stayIdx === -1 || sIdx < stayIdx)) stayIdx = sIdx;
        }
        if (val.indexOf('不') !== -1) {
          var notIdx = val.indexOf('不');
          if (val.indexOf('離開') !== -1 || val.indexOf('离开') !== -1 || val.indexOf('走') !== -1 || val.indexOf('跑') !== -1) {
            if (stayIdx === -1 || notIdx < stayIdx) stayIdx = notIdx;
          }
        }
        if (val.indexOf('別') !== -1) {
          var bieIdx = val.indexOf('別');
          if (val.indexOf('離開') !== -1 || val.indexOf('离开') !== -1 || val.indexOf('走') !== -1) {
            if (stayIdx === -1 || bieIdx < stayIdx) stayIdx = bieIdx;
          }
        }
        if (val.indexOf('我') !== -1 && val.indexOf('你') !== -1 && loveIdx === -1) {
          var woIdx = val.indexOf('我');
          if (stayIdx === -1 || woIdx < stayIdx) stayIdx = woIdx;
        }

        var useLove = false;
        if (loveIdx !== -1 && stayIdx !== -1) {
          useLove = (loveIdx < stayIdx);
        } else if (loveIdx !== -1) {
          useLove = true;
        } else if (stayIdx === -1) {
          failCount++;
          if (failCount < 3) {
            row.classList.add('shake');
            input.value = '';
            setTimeout(function () { row.classList.remove('shake'); }, 400);
          } else {
            input.value = '';
            if (failCount === 3 && hintEl) {
              var available = hintPool.filter(function (h) { return hintUsed.indexOf(h) === -1; });
              if (available.length === 0) { hintUsed = []; available = hintPool.slice(); }
              var picked = available[Math.floor(Math.random() * available.length)];
              hintUsed.push(picked);
              hintEl.textContent = picked;
              hintEl.classList.add('show');
            }
          }
          return;
        }

        var mainLine, subLine;
        if (useLove) {
          mainLine = '我知道。';
          subLine = '從你第一次猶豫的時候，我就知道了。';
        } else {
          mainLine = '我不會。';
          subLine = '只要你願意，我一直都在。';
        }

        s.innerHTML =
          '<div class="final-reply show">' +
            '<div class="line1"><span id="typeLine1"></span><span class="type-cursor" id="typeCursor"></span></div>' +
            '<div class="line2" id="typeLine2" style="opacity:0;transition:opacity .8s;"></div>' +
            '<button class="close-btn" id="closeLeaveScreen" style="opacity:0;transition:opacity .8s;display:none;">關閉</button>' +
          '</div>';

        var typeEl = $('typeLine1');
        var cursorEl = $('typeCursor');
        var typeTarget = mainLine;
        var typeLen = typeTarget.length;
        var typeInterval = 1800 / typeLen;
        var typeIdx = 0;

        setTimeout(function () {
          var typer = setInterval(function () {
            if (typeIdx >= typeLen) {
              clearInterval(typer);
              if (cursorEl) cursorEl.classList.add('hide');

              setTimeout(function () {
                var line2 = $('typeLine2');
                if (line2) { line2.textContent = subLine; line2.style.opacity = '1'; }
                setTimeout(function () {
                  var cb = $('closeLeaveScreen');
                  if (cb) {
                    cb.style.display = '';
                    cb.style.opacity = '1';
                    cb.onclick = function () {
                      s.classList.remove('show');
                      setTimeout(function () {
                        returnToHome();
                      }, 600);
                    };
                  }
                }, 600);
              }, 200);
              return;
            }
            typeEl.textContent = typeTarget.substring(0, typeIdx + 1);
            typeIdx++;
          }, typeInterval);
        }, 100);
      }

      sendBtn.onclick = trySubmit;
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') trySubmit(); });
    }, 50);
  }

  function showReentryHint(callback) {
    var r = $('reentryScreen');
    if (!r) { callback(); return; }
    r.innerHTML = '<div class="reentry-text"><span id="reentryText"></span><span class="type-cursor" id="reentryCursor"></span></div>';
    r.classList.add('show');

    var full = '想看看我什麼反應嗎？';
    var idx = 0;
    var typeEl = $('reentryText');
    var cursorEl = $('reentryCursor');
    var typeInterval = 1500 / full.length;

    setTimeout(function () {
      var typer = setInterval(function () {
        if (idx >= full.length) {
          clearInterval(typer);
          if (cursorEl) cursorEl.classList.add('hide');
          setTimeout(function () {
            r.classList.remove('show');
            setTimeout(function () { callback(); }, 600);
          }, 1200);
          return;
        }
        typeEl.textContent = full.substring(0, idx + 1);
        idx++;
      }, typeInterval);
    }, 200);
  }

  function startSurvey() {
    $('homeScreen').classList.add('hidden');
    $('surveyScreen').classList.remove('hidden');
    currentQ = 1; q10Glitch = false; q14Replaced = false;
    reward2Shown = false; rewardEndShown = false; pageCollapsed = false; transitioning = false;
    clearTimer(); clearIdleTimer(); resetAudio();
    document.body.classList.remove('dark-mode'); document.body.classList.remove('collapse-mode');
    $('callTimerContainer').innerHTML = ''; hideBottom(); hideOverlay();
    $('modal').className = 'modal'; $('modal').innerHTML = '';
    $('qHint').textContent = ''; $('qHint').classList.remove('show');
    $('progressFill').classList.remove('danger');
    renderQuestion();
  }

  function init() {
    var startBtn = $('startBtn');
    if (startBtn) {
      startBtn.onclick = function () {
        if (hasCompletedOnce && !reentryShown) {
          reentryShown = true;
          showReentryHint(function () { startSurvey(); });
        } else {
          startSurvey();
        }
      };
    }
    var closeBtn = $('closeSurvey');
    if (closeBtn) closeBtn.onclick = function () { if (confirm('确定要退出吗？')) location.reload(); };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
